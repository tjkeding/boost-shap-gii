# ---Example Configuration for Global Importance Index with Boosted SHAP---

execution:
  n_jobs: 45          # Global core limit (number of CPUs for parallel processing)
  random_seed: 42     # Master seed

paths:
  input_data: "/path/to/your/data.csv"
  output_dir: "/path/to/your/output_run/"

features:
  continuous_groups:
    - pattern: "age_index"
      match_mode: "exact"
      exclude: []

    - pattern: "score_pre_cluster"
      match_mode: "substring"
      exclude: []

  ordinal_groups:
    - pattern: "education_level"
      match_mode: "substring"
      exclude: ["code"]
      levels:
        - "Less than high school"
        - "High school or GED"
        - "Some college"
        - "Postsecondary certificate"
        - "Associate degree"
        - "Bachelor's degree"
        - "Master's degree"
        - "Doctoral or professional degree"

    - pattern: "item_pre"
      match_mode: "substring"
      exclude: ["cluster", "total", "impairment","event","version"]
      levels: [0, 1, 2, 3, 4]

    - pattern: "symptom_pre"
      match_mode: "substring"
      exclude: ["cluster", "total","event", "version"]
      levels: [0, 1, 2, 3, 4, 5]

  nominal_groups:
    - pattern: "sex"
      match_mode: "exact"
      exclude: []

    - pattern: "ethnicity"
      match_mode: "exact"
      exclude: []

    - pattern: "group"
      match_mode: "substring"
      exclude: ["thq","code"]

modeling:
  outcome: "outcome_total"    # String for single outcome; list for multi_regression (e.g., ["y1", "y2"])
  cv_folds: 10
  cv_strategy: "uniform"         # CV splitter: "uniform" (KFold), "stratified" (StratifiedKFold), or "group" (GroupKFold)
  # group_column: "subject_id"   # Required when cv_strategy: "group"; names the grouping column

  # task_type: "regression"      # Optional: regression, binary_classification, multiclass_classification, multi_regression
  loss_function: "RMSE"          # Training loss: RMSE, MAE, Huber:delta=VALUE, MultiRMSE, Logloss, MultiClass

  tuning:
    n_iter: 500
    scoring: "neg_rmse"          # Tuning metric: neg_rmse, neg_mae, r2, roc_auc, balanced_accuracy, f1_weighted
    inner_cv_folds: 5
    n_inner_repeats: 1           # Averaged inner CV repeats per Optuna trial (1 = no repeats)
    early_stopping_rounds: 250

    search_space:
      iterations:
        low: 500
        high: 10000
      learning_rate:
        low: 0.00001
        high: 0.3
        log: true
      depth:
        low: 2
        high: 10
      l2_leaf_reg:
        low: 0.001
        high: 100.0
        log: true
      random_strength:
        low: 0.001
        high: 10.0
        log: true
      min_data_in_leaf:
        low: 1
        high: 50
      bagging_temperature:
        low: 0.1
        high: 1.0
        log: false
      border_count:
        low: 32
        high: 255
      one_hot_max_size:
        low: 2
        high: 25
      colsample_bylevel:
        low: 0.05
        high: 1.0

shap:
  output_microdata_n: 25       # Extra non-significant features to save microdata for (R plotting)

  bootstrapping:
    n_boot: 10000         # Number of bootstrap iterations
    alpha: 0.05           # Significance level (for CIs and FDR)
    fdr_correct: true     # Use FDR corrected q (instead of p) for significance testing
    fdr_method: "bh"      # FDR correction method: "bh" (Benjamini-Hochberg) or "by" (Benjamini-Yekutieli)
    stab_thresh: 2        # Significance level for stability (2 = twice as much signal as noise)
    output_boots_n: 25    # Extra non-significant features to save bootstraps for

  splines:
    n_knots: 4            # Knots for 1D/2D splines (smoothness)
    degree: 3             # Polynomial degree (3=Cubic)
    discrete_threshold: 15  # Must satisfy: discrete_threshold >= n_knots + degree + 2 (Wood 2017 GAM ch. 4)

  # Per-individual SHAP CI and scaling configuration
  indiv_ci_nboot: 2500           # Coupled bootstrap iterations for per-individual SHAP CIs (0 disables)
  indiv_scaling_mode: "sd"       # Scaling: "raw", "sd" (regression only), or "custom_value"
  indiv_scaling_value: 1.0       # Divisor when indiv_scaling_mode="custom_value"; must be > 0
  compute_global_on_inference: false  # If true, infer.py emits population-level GII on inference data

# aggregate_shap:
#   subscale_A_total:              # Group name (must not collide with a feature name)
#     - "subscale_A_item1"         # Constituent features (disjoint, no nominals)
#     - "subscale_A_item2"
#     - "subscale_A_item3"
#   subscale_B_total:
#     - "subscale_B_item1"
#     - "subscale_B_item2"

plot:
  outcome_max: 100.0             # Theoretical maximum of the outcome (scales GII plot magnitudes)
  negate_shap: false             # If true, sign-flip SHAP y-axis values on plots
  gii_y_label: "Global Importance Index (GII)"
  gii_y_sublabel: "SHAP-based feature importance"

  indiv_y_label: "SHAP Value (scaled)"

  indiv_y_sublabel: "Per-individual contribution to predicted outcome"
